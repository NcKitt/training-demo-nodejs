apiVersion: apps/v1
kind: Deployment
metadata:
  name: employees-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employees-api
  template:
    metadata:
      labels:
        app: employees-api
    spec:
      containers:
        - name: api
          image: somkiat/employees-api:1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: employees-db-config
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employees-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: employees-db-config
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@db:5432/$(DB_NAME)
            - name: PORT
              value: "3000"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi